<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cassanova Cashier Test Widget</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .deposit-card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 360px; border: 1px solid #333; }
        h3 { margin-top: 0; margin-bottom: 20px; color: #fff; font-size: 1.4rem; text-align: center; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { border-color: #00bcd4; outline: none; }
        button { background: #00bcd4; color: #121212; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; margin-bottom: 0; }
        button:hover { background: #00acc1; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="deposit-card">
  <h3>Deposit Cashier</h3>
  
  <label>Amount (USD):</label>
  <input type="number" id="depositAmount" value="250" min="10" />
  
  <label>Currency Asset:</label>
  <select id="depositCurrency">
    <option value="USD">USD ($)</option>
    <option value="SOL">SOL (Solana)</option>
    <option value="BTC">BTC (Bitcoin)</option>
  </select>
  
  <button id="depositBtn" onclick="handleDeposit()">Proceed to Checkout</button>
</div>

<script>
async function handleDeposit() {
  const amountInput = document.getElementById('depositAmount').value;
  const currencyInput = document.getElementById('depositCurrency').value;
  const depositButton = document.getElementById('depositBtn');

  depositButton.disabled = true;
  depositButton.innerText = "Connecting Gateway...";

  try {
    const response = await fetch('http://localhost:5050/api/transactions/create-universal-deposit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amount: parseFloat(amountInput),
        currency: currencyInput
      })
    });

    const data = await response.json();

    if (data.success && data.checkoutUrl) {
      // Redirect your browser to the simulated gateway link
      window.location.href = data.checkoutUrl;
    } else {
      alert("Gateway rejected: " + data.message);
      depositButton.disabled = false;
      depositButton.innerText = "Proceed to Checkout";
    }
  } catch (error) {
    console.error("Network layer breakdown:", error);
    alert("Could not reach backend server. Make sure your server is running on port 5050!");
    depositButton.disabled = false;
    depositButton.innerText = "Proceed to Checkout";
  }
}
</script>

</body>
</html>
